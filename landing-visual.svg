<svg width="100%" height="320" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="gradeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feOffset dx="2" dy="2" in="blur" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky gradient background -->
  <rect width="800" height="400" fill="url(#skyGrad)"/>

  <!-- Campus landscape -->
  <g filter="url(#softShadow)">
    <!-- Main building -->
    <rect x="80" y="220" width="140" height="160" fill="url(#buildingGrad)" rx="8"/>
    <!-- Annex wing left -->
    <rect x="20" y="240" width="80" height="140" fill="url(#buildingGrad)" rx="6"/>
    <!-- Annex wing right -->
    <rect x="300" y="230" width="100" height="150" fill="url(#buildingGrad)" rx="6"/>
    <!-- Additional block -->
    <rect x="500" y="210" width="120" height="170" fill="url(#buildingGrad)" rx="8"/>
    <!-- Smaller pavilion -->
    <rect x="680" y="220" width="90" height="160" fill="url(#buildingGrad)" rx="6"/>
  </g>

  <!-- Central dome/tower -->
  <g>
    <polygon points="400,120 440,200 360,200" fill="#0F172A" />
    <!-- Dome ring -->
    <circle cx="400" cy="120" r="28" fill="#1E293B" />
    <!-- Dome accent stripe -->
    <circle cx="400" cy="120" r="20" fill="url(#accentGrad)" />
    <!-- Window pattern -->
    <g fill="#64748B" opacity="0.6">
      <line x1="380" y1="130" x2="420" y2="130" />
      <line x1="380" y1="145" x2="420" y2="145" />
      <line x1="380" y1="160" x2="420" y2="160" />
    </g>
    <!-- Main entrance -->
    <rect x="390" y="150" width="20" height="50" fill="#3F83F8" />
    <path d="M390 150 L400 190 L410 150 Z" fill="none" stroke="#64748B" stroke-width="1" />
  </g>

  <!-- Landscaping -->
  <g fill="#10B981" opacity="0.4">
    <ellipse cx="100" cy="280" rx="25" ry="10" />
    <ellipse cx="280" cy="270" rx="20" ry="8" />
    <ellipse cx="460" cy="285" rx="22" ry="9" />
    <ellipse cx="660" cy="275" rx="18" ry="7" />
  </g>

  <!-- Digital workflow overlay -->
  <g>
    <!-- Nodes -->
    <circle cx="150" cy="260" r="7" fill="#3B82F6" />
    <circle cx="280" cy="240" r="7" fill="#3B82F6" />
    <circle cx="420" cy="270" r="8" fill="#3B82F6" />
    <circle cx="560" cy="250" r="7" fill="#3B82F6" />
    <circle cx="680" cy="275" r="8" fill="#3B82F6" />
    
    <!-- Connecting lines -->
    <line x1="150" y1="260" x2="280" y2="240" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <line x1="280" y1="240" x2="420" y2="270" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <line x1="420" y1="270" x2="560" y2="250" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <line x1="560" y1="250" x2="680" y2="275" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Document/approval icons -->
  <g fill="#3B82F6">
    <path d="M200 310 L220 290 L240 310 L220 330 Z" />
    <path d="M340 300 L360 280 L380 300 L360 320 Z" />
    <path d="M480 320 L500 300 L520 320 L500 340 Z" />
    <path d="M620 310 L640 290 L660 310 L640 330 Z" />
  </g>

  <!-- Subtle accent highlight -->
  <g fill="#FF6B1C" opacity="0.3">
    <path d="M100 340 Q150 350 200 340 Q250 330 300 340 Q350 350 400 340 Q450 330 500 340 Z" />
  </g>

  <!-- No decorative text inside SVG - pure graphical illustration -->
</svg>